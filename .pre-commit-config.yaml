default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # ruff version
  rev: v0.16.4
  hooks:
    - id: ruff-format # formatter
      types_or: [python, pyi, jupyter, toml]
    - id: ruff-check # linter
      types_or: [python, pyi, jupyter, toml]
      args: [--fix]
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.12.5
  hooks:
    # Update the uv lockfile
    - id: uv-lock
- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 1.3.0.dev2  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
      language: system  # Use system-installed pyrefly