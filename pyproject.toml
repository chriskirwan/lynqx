[project]
name = "lynqx"
version = "0.0.1"
description = "Lattice Yang-Mills Gauge Theories in python, powered by JAX"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name="Christopher Kirwan", email="christopher.kirwan@ibm.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python"
]
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.7",
    "jax>=0.10.0",
    "lineax>=0.1.0",
    "optax>=0.2.8",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.optional-dependencies]
cpu = []
gpu = ["jax[cuda13]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["lynqx/*"]

[tool.ruff]
line-length = 119
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ipykernel>=7.2.0",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "matplotlib>=3.10.9",
    "pyqt6>=6.11.0",
    "ty>=0.0.63"
    # "ty>=0.0.63; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
docs = ["zensical>=0.0.29"]
test = [
    "beartype>=0.22.9",
    "pytest>=9.0.3"
]
