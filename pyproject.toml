[project]
name = "lynqx"
version = "0.0.1"
description = "Lattice Yang-Mills Gauge Theories in python, powered by JAX"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="Christopher Kirwan", email="christopher.kirwan@ibm.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python"
]
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.1",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
cpu = []
gpu = ["jax[cuda13]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = ["lynqx/*"]

[tool.ruff]
line-length = 119
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.pyrefly]
project-excludes = [
    "tests/**"
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ipykernel>=7.3.0",
    "rich>=15.0.0",
    "ruff>=0.16.7",
    "matplotlib>=3.11.1",
    "pyqt6>=6.11.0",
    "pyrefly>=1.3.0",
]
docs = ["zensical>=0.0.62"]
test = [
    "beartype>=0.22.9",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-testmon>=2.2.0",
]
